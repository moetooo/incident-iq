[project]
name = "incidentiq-backend"
version = "0.1.0"
description = "IncidentIQ backend: incident lifecycle, RCA and safe remediation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated and intentionally keep long column definitions.
"migrations/versions/*" = ["E501"]
